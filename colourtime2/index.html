  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f5;
      display: flex;
      flex-direction: column;

    /* Single Row Main Layout */
    .game-container {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: stretch;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* Common Card Styling */
    .panel {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel h3 { 
      margin-bottom: 8px; 
      color: #444; 
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      text-align: center;
      white-space: nowrap;
    }

    /* Panel 1: Reference (Slightly Smaller) */
    .ref-panel {
      flex: 0 1 32%;
      max-width: 340px;
    }

    /* Panel 2: Target Canvas (Main Interactive Area) */
    .target-panel {
      flex: 0 1 45%;
      max-width: 440px;
    }

    /* Panel 3: Color Palette (Large & Prominent) */
    .palette-panel {
      flex: 0 0 auto;
      min-width: 150px;
      width: 18%;
      max-width: 200px;
    }

    .canvas-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    /* SVG Scalability */
    svg {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 3px solid #d0d7de;
      border-radius: 12px;
      background-color: #ffffff;
      display: block;
    }

    .target-canvas path, .target-canvas circle, .target-canvas polygon {
      cursor: pointer;
      transition: fill 0.15s ease;
    }
    
    .target-canvas path:hover, .target-canvas circle:hover, .target-canvas polygon:hover {
      stroke: #111;
      stroke-width: 3.5px;
    }

    /* Responsive Grid Palette */
    .palette-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      padding: 4px;
      align-content: space-evenly;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 48px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid #cbd5e1;
      background-color: #ffffff;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
    }

    .swatch img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .swatch:hover {
      transform: scale(1.05);
      border-color: #64748b;
    }

    .swatch.active {
      border-color: #2563eb;
      border-width: 3px;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    
    .shake { animation: shake 0.3s ease-in-out; }

    /* Fine-tuning for smaller screens without stacking */
    @media (max-width: 768px) {
      body { padding: 6px; }
      .game-container { gap: 6px; }
      .panel { padding: 8px; border-radius: 12px; }
      .palette-panel { min-width: 110px; }
      .palette-container { gap: 4px; }
      .swatch { min-height: 36px; border-radius: 6px; }
    }
  </style>
</head>

          { id: 'foot_l_out',  targetColor: 'brown',       type: 'circle', cx: 140, cy: 360, r: 45 },
          { id: 'foot_l_in',   targetColor: 'yellow',      type: 'circle', cx: 140, cy: 360, r: 25 },
          { id: 'foot_r_out',  targetColor: 'brown',       type: 'circle', cx: 310, cy: 360, r: 45 },

          { id: 'body',        targetColor: 'brown',       type: 'circle', cx: 225, cy: 290, r: 85 },

          { id: 'smoke',       targetColor: 'grey',        type: 'path', path: 'M 215 90 C 190 70 200 40 230 40 C 250 40 250 60 230 70 Z' },

        ]

    ];

    let currentLevelIndex = 0;
    let selectedColor = null;
    let paintedSegments = {};

    function initPalette() {
      const palette = document.getElementById('palette');
      palette.innerHTML = '';

      YOUR_COLORS.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch';

        const img = document.createElement('img');
        img.src = color.png;
        img.alt = color.name;
        
        img.onerror = () => { 
          img.style.display = 'none'; 
          swatch.style.backgroundColor = color.hex;
        }; 
        swatch.appendChild(img);

        swatch.addEventListener('click', () => {
          document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          selectedColor = color.name;
        });

        palette.appendChild(swatch);
      });
    }

    function loadLevel(index) {
      const level = LEVELS[index];
      document.getElementById('levelTitle').textContent = level.title;
      paintedSegments = {};

      const createSVG = (isTarget) => {
        let svg = `<svg viewBox="0 0 450 450" style="background-color: ${level.bg}">`;
        level.segments.forEach(seg => {
          const colorObj = YOUR_COLORS.find(c => c.name === seg.targetColor) || { hex: '#FFFFFF' };
          const fill = isTarget ? '#FFFFFF' : colorObj.hex;
          const idAttr = `${isTarget ? 't_' : 'r_'}${seg.id}`;

          if (seg.type === 'circle') {
            svg += `<circle id="${idAttr}" cx="${seg.cx}" cy="${seg.cy}" r="${seg.r}" fill="${fill}" stroke="#222222" stroke-width="2.5" data-target="${seg.targetColor}" data-id="${seg.id}" />`;
          } else {
            svg += `<path id="${idAttr}" d="${seg.path}" fill="${fill}" stroke="#222222" stroke-width="2.5" data-target="${seg.targetColor}" data-id="${seg.id}" />`;
          }
        });
        svg += `</svg>`;
        return svg;
      };

      document.getElementById('referenceContainer').innerHTML = createSVG(false);
      document.getElementById('targetContainer').innerHTML = createSVG(true);

      document.querySelectorAll('#targetContainer path, #targetContainer circle').forEach(element => {
        element.addEventListener('click', onSegmentClick);
      });
    }

    function onSegmentClick(e) {
      const el = e.target;
      const targetColor = el.getAttribute('data-target');
      const id = el.getAttribute('data-id');

      if (!selectedColor) return;

      if (selectedColor === targetColor) {
        const colorObj = YOUR_COLORS.find(c => c.name === selectedColor);
        el.setAttribute('fill', colorObj.hex);
        paintedSegments[id] = true;
        checkWin();
      } else {
        el.classList.add('shake');
        setTimeout(() => el.classList.remove('shake'), 300);
      }
    }

    function checkWin() {
      const level = LEVELS[currentLevelIndex];
      if (Object.keys(paintedSegments).length === level.segments.length) {
        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        setTimeout(() => {
          currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
          loadLevel(currentLevelIndex);
        }, 1800);
      }
    }

    initPalette();
    loadLevel(0);
  </script>
