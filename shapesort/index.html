<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fill the Gap</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #game-container {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: #0f172a;
    }

    #score {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2563eb;
      background: #eff6ff;
      padding: 6px 18px;
      border-radius: 20px;
    }

    canvas {
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      background: #ffffff;
      display: block;
      cursor: pointer;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header-bar">
    <h1>Fill the Gap</h1>
    <div id="score">Score: 0</div>
  </div>

  <canvas id="gameCanvas" width="720" height="540"></canvas>

  <!-- START OVERLAY -->
  <div id="start-overlay" class="overlay">
    <h2 style="font-size: 2.2rem; color: #0f172a; margin-bottom: 8px;">Fill the Gap</h2>
    <p style="color: #64748b; font-size: 1.1rem; margin-bottom: 24px;">Tap the correct card below to fill the missing shape gap!</p>
    <button class="btn" onclick="startGame()">Start Playing</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const startOverlay = document.getElementById('start-overlay');

// List of 6 Shapes with exact theme colors
const SHAPES = [
  { id: 'square',    label: 'square',    color: '#E63935' }, // Red
  { id: 'circle',    label: 'circle',    color: '#38A0DC' }, // Blue
  { id: 'triangle',  label: 'triangle',  color: '#6BBF59' }, // Green
  { id: 'rectangle', label: 'rectangle', color: '#8E24AA' }, // Purple
  { id: 'pentagon',  label: 'pentagon',  color: '#FB8C00' }, // Orange
  { id: 'hexagon',   label: 'hexagon',   color: '#FDD835' }  // Yellow
];

const TARGET_RECT = { x: 210, y: 25, w: 300, h: 210, radius: 20 };

let score = 0;
let targetShape = null;
let choices = [];
let feedback = { type: '', text: '', color: '', timer: 0 };
let isHoleFilled = false;

function initRound() {
  isHoleFilled = false;
  
  // Pick random target shape
  targetShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  
  // Pick 2 other random distractor shapes
  let remaining = SHAPES.filter(s => s.id !== targetShape.id);
  remaining.sort(() => Math.random() - 0.5);
  
  let optionPool = [targetShape, remaining[0], remaining[1]].sort(() => Math.random() - 0.5);
  
  // Positioning for 3 LARGE cards in bottom tray
  const startX = 40;
  const startY = 320;
  const cardWidth = 180;
  const cardHeight = 180;
  const spacingX = 230;
  
  choices = optionPool.map((shape, index) => {
    return {
      ...shape,
      x: startX + index * spacingX,
      y: startY,
      w: cardWidth,
      h: cardHeight,
      isCorrect: shape.id === targetShape.id
    };
  });
}

function startGame() {
  score = 0;
  scoreEl.textContent = `Score: 0`;
  startOverlay.style.display = 'none';
  initRound();
  requestAnimationFrame(gameLoop);
}

// Universal Vector Path Drawer for all 6 shapes
function drawShapePath(shapeId, cx, cy, size) {
  ctx.beginPath();

  if (shapeId === 'square') {
    ctx.rect(cx - size/2, cy - size/2, size, size);
  } else if (shapeId === 'circle') {
    ctx.arc(cx, cy, size/2, 0, Math.PI * 2);
  } else if (shapeId === 'triangle') {
    const height = size * (Math.sqrt(3) / 2);
    ctx.moveTo(cx, cy - height/2 - 4);
    ctx.lineTo(cx + size/2, cy + height/2);
    ctx.lineTo(cx - size/2, cy + height/2);
    ctx.closePath();
  } else if (shapeId === 'rectangle') {
    const w = size * 1.3;
    const h = size * 0.8;
    ctx.rect(cx - w/2, cy - h/2, w, h);
  } else if (shapeId === 'pentagon') {
    const r = size / 1.8;
    for (let i = 0; i < 5; i++) {
      const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (shapeId === 'hexagon') {
    const r = size / 1.8;
    for (let i = 0; i < 6; i++) {
      const angle = (i * 2 * Math.PI / 6) - Math.PI / 6;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
}

// Function to render shapes with custom colors & black outlines
function drawShapePiece(shapeId, cx, cy, size, fillColor, strokeColor, strokeWidth = 5) {
  ctx.save();
  ctx.fillStyle = fillColor;
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = strokeWidth;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  drawShapePath(shapeId, cx, cy, size);
  
  ctx.fill();
  if (strokeWidth > 0) ctx.stroke();
  ctx.restore();
}

function drawCardBackground(x, y, width, height, radius, fillStyle) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  
  ctx.fillStyle = fillStyle;
  ctx.fill();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();
}

// Dynamic Flashcard Generator
function drawFlashcard(choice) {
  ctx.save();
  
  // Card base with soft shadow & rounded corners
  ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(choice.x, choice.y, choice.w, choice.h, 16);
  ctx.fill();
  
  // Reset shadow for crisp border drawing
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Colored Shape in Center
  const cx = choice.x + choice.w / 2;
  const cy = choice.y + choice.h / 2 - 14;
  drawShapePiece(choice.id, cx, cy, 80, choice.color, '#000000', 5);

  // Lowercase Text Label
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 20px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(choice.label, cx, choice.y + choice.h - 18);
  
  ctx.restore();
}

// Draws a Vibrant Green Vector Tick Badge
function drawGreenTick(cx, cy) {
  ctx.save();

  // Glowing Green Circle Badge
  ctx.shadowColor = 'rgba(34, 197, 94, 0.4)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#22c55e'; // Vibrant Green
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, Math.PI * 2);
  ctx.fill();

  // Reset shadow for inner tick
  ctx.shadowColor = 'transparent';

  // White Vector Checkmark
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy + 1);
  ctx.lineTo(cx - 2, cy + 7);
  ctx.lineTo(cx + 9, cy - 6);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!targetShape) return;

  // 1. Top Target Board Card
  drawCardBackground(TARGET_RECT.x, TARGET_RECT.y, TARGET_RECT.w, TARGET_RECT.h, TARGET_RECT.radius, targetShape.color);

  const centerX = TARGET_RECT.x + TARGET_RECT.w / 2;
  const centerY = TARGET_RECT.y + TARGET_RECT.h / 2;

  // 2. Cutout Hole OR Fitted Shape Piece
  if (isHoleFilled) {
    drawShapePiece(targetShape.id, centerX, centerY, 110, targetShape.color, '#000000', 6);
  } else {
    // White hole with black outline
    drawShapePiece(targetShape.id, centerX, centerY, 110, '#FFFFFF', '#000000', 5);
  }

  // Tray Divider Line
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20, 270);
  ctx.lineTo(700, 270);
  ctx.stroke();

  // 3. Draw Bottom Flashcard Choices
  choices.forEach(c => {
    drawFlashcard(c);
  });

  // 4. Feedback Indicator
  if (feedback.timer > 0) {
    if (feedback.type === 'tick') {
      drawGreenTick(canvas.width / 2, 295);
    } else {
      ctx.fillStyle = feedback.color;
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(feedback.text, canvas.width / 2, 302);
    }
    feedback.timer--;
  }
}

function handleSelect(e) {
  if (feedback.timer > 20 || isHoleFilled) return; 

  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const clickX = clientX - rect.left;
  const clickY = clientY - rect.top;

  for (let c of choices) {
    if (clickX >= c.x && clickX <= c.x + c.w &&
        clickY >= c.y && clickY <= c.y + c.h) {
      
      if (c.isCorrect) {
        score++;
        scoreEl.textContent = `Score: ${score}`;
        isHoleFilled = true;
        feedback = { type: 'tick', timer: 45 };
        
        // Endless loop: seamlessly generate next round
        setTimeout(() => {
          initRound();
        }, 850);

      } else {
        feedback = { type: 'text', text: "❌ Try Again!", color: "#dc2626", timer: 40 };
      }
      break;
    }
  }
}

canvas.addEventListener('click', handleSelect);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleSelect(e); });

function gameLoop() {
  draw();
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
