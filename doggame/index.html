<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cartoon Dog Game Scene</title>
    <style>
        /* Forces the page to stay open and display background */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #bae1ff; /* Sky Blue */
            font-family: sans-serif;
        }

        /* Fixed container that cannot collapse */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        /* --- ENVIRONMENT --- */
        .sun {
            position: absolute;
            top: 30px;
            right: 15%;
            width: 80px;
            height: 80px;
            background: #ffdf00;
            border-radius: 50%;
            z-index: 1;
        }

        /* --- SIMPLE SCARCE GRASS (CLUMPS) --- */
        .grass-clump {
            position: absolute;
            width: 30px;
            height: 25px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .blade {
            width: 6px;
            background-color: #5cb85c;
            border: 2px solid #3d8b3d;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            transform-origin: bottom center;
        }

        .blade-left { height: 70%; transform: rotate(-20deg); }
        .blade-center { height: 100%; }
        .blade-right { height: 80%; transform: rotate(20deg); }

        /* Anchored directly to the 42% grass horizon line to prevent floating */
        .bg-grass-1 { bottom: 42%; left: 20%; z-index: 1; }
        .bg-grass-2 { bottom: 42%; right: 25%; z-index: 1; }

        /* Placed scarcely in the front of screen */
        .fg-grass-1 { bottom: 8%; left: 30%; z-index: 5; }
        .fg-grass-2 { bottom: 15%; right: 35%; z-index: 5; }

        /* --- FENCE --- */
        .fence {
            position: absolute;
            bottom: 40%; 
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            z-index: 2;
        }

        .fence-post {
            width: 15px;
            height: 100%;
            background-color: #cd853f;
            border: 2px solid #8b5a2b;
            border-radius: 3px 3px 0 0;
            position: relative;
        }

        .fence::before, .fence::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #b57c43;
            border: 2px solid #8b5a2b;
            z-index: -1;
        }
        .fence::before { top: 10px; }
        .fence::after { bottom: 10px; }

        /* --- GRASS BASE --- */
        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42%;
            background-color: #77dd77;
            border-top: 5px solid #5cb85c;
            z-index: 3;
        }

        /* --- MASTER SCALER --- */
        .dog-scaler {
            position: absolute;
            bottom: 10%; 
            left: 50%;
            transform: translateX(-50%) scale(2); /* Doubled Size */
            transform-origin: bottom center;
            width: 220px;
            height: 240px;
            z-index: 10; 
            transition: transform 2s ease-in-out, bottom 2s ease-in-out, left 2s ease-in-out, opacity 0.3s ease;
        }

        /* --- CARTOON DOG --- */
        .dog-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Dog Tail */
        .tail {
            position: absolute;
            bottom: 22px;
            left: 36px; 
            width: 18px;
            height: 60px;
            background-color: #a05a2c;
            border: 4px solid #5a3316;
            border-radius: 10px 10px 0 0;
            transform-origin: bottom center;
            transform: rotate(-25deg);
            z-index: 1; 
            animation: css-wag 20s infinite ease-in-out;
        }

        @keyframes css-wag {
            0%, 90%, 100% { transform: rotate(-25deg); }
            91% { transform: rotate(-45deg); }
            92% { transform: rotate(-10deg); }
            93% { transform: rotate(-45deg); }
            94% { transform: rotate(-10deg); }
            95% { transform: rotate(-45deg); }
            96% { transform: rotate(-10deg); }
        }

        /* Dog Body */
        .dog-body {
            position: absolute;
            bottom: 10px;
            left: 45px;
            width: 130px;
            height: 110px;
            background-color: #df9b56;
            border: 4px solid #8b5a2b;
            border-radius: 70px 70px 40px 40px;
            z-index: 2;
        }

        .paw {
            position: absolute;
            bottom: -5px;
            width: 35px;
            height: 25px;
            background-color: #df9b56;
            border: 4px solid #8b5a2b;
            border-radius: 15px 15px 10px 10px;
            transition: border-radius 0.3s ease;
        }
        .paw.left { left: 15px; }
        .paw.right { right: 15px; }

        /* Dog Head */
        .dog-head {
            position: absolute;
            top: 20px;
            left: 40px;
            width: 140px;
            height: 120px;
            background-color: #f1b26f;
            border: 4px solid #8b5a2b;
            border-radius: 80px 80px 70px 70px;
            z-index: 3;
            transform-origin: bottom center;
            transition: transform 0.3s ease-in-out;
            animation: css-bark-bounce 20s infinite ease-in-out;
        }

        @keyframes css-bark-bounce {
            0%, 90%, 100% { transform: scale(1); }
            91%, 93%, 95% { transform: scale(1.08) translateY(-6px); }
            92%, 94%, 96% { transform: scale(1); }
        }

        /* Smaller Floppy Ears */
        .ear {
            position: absolute;
            top: 15px;
            width: 28px; 
            height: 65px; 
            background-color: #a05a2c;
            border: 4px solid #5a3316;
            border-radius: 50% 50% 40% 40%;
            z-index: -1;
        }
        .ear.left { left: -10px; transform: rotate(-15deg); }
        .ear.right { right: -10px; transform: rotate(15deg); }

        /* Eyes */
        .eye {
            position: absolute;
            top: 35px;
            width: 24px;
            height: 32px;
            background-color: #222;
            border-radius: 50%;
            transition: height 0.15s ease, top 0.15s ease;
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }
        .eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }

        /* Happy Closed Eyes styling when petted */
        .dog-container.happy-pet .eye {
            height: 6px;
            top: 48px;
            border-radius: 0;
            background-color: #222;
        }
        .dog-container.happy-pet .eye::after {
            display: none;
        }

        /* Snout */
        .snout {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 45px;
            background-color: #fff;
            border: 3px solid #8b5a2b;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .nose {
            width: 26px;
            height: 18px;
            background-color: #222;
            border-radius: 12px 12px 15px 15px;
            margin-top: 5px;
        }

        .tongue {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 28px;
            background-color: #ff4d4d;
            border: 3px solid #8b5a2b;
            border-top: none;
            border-radius: 0 0 12px 12px;
            z-index: -1;
            transform-origin: top center;
        }

        /* Held Ball (Spawns in mouth when returning ball) */
        .held-ball {
            position: absolute;
            bottom: -10px;
            left: 50%;
            margin-left: -12px;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border: 2px solid #222;
            border-radius: 50%;
            z-index: 5;
            display: none;
        }

        .dog-container.holding-ball .held-ball {
            display: block;
        }

        .dog-container.holding-ball .tongue {
            display: none; /* Hide tongue so ball fits perfectly */
        }

        /* Red Collar (Narrower Width) */
        .collar {
            position: absolute;
            bottom: 95px;
            left: 67px;
            width: 86px;
            height: 18px;
            background-color: #e74c3c; 
            border: 3px solid #78281f;
            border-radius: 10px;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Active walking states for Collar */
        .dog-container.walking .collar {
            opacity: 1;
        }

        /* Dog bounce animation while walking */
        @keyframes walk-bounce {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(0.95, 1.05) translateY(-10px); }
        }

        .dog-container.walking {
            animation: walk-bounce 0.4s infinite ease-in-out;
        }

        /* Active drinking / eating state transitions */
        .dog-container.drinking .dog-head,
        .dog-container.eating .dog-head {
            animation: none; 
            transform: rotate(-24deg) translate(-28px, 35px); 
        }

        .dog-container.drinking .tongue,
        .dog-container.eating .tongue {
            animation: lick-animation 0.2s infinite ease-in-out;
        }

        @keyframes lick-animation {
            0%, 100% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(1.5) translateY(4px); }
        }

        /* Dog animation when barking happily */
        .dog-container.barking .dog-head {
            animation: none;
            transform: scale(1.1) translateY(-12px);
        }

        /* Dog animation when being petted */
        .dog-container.happy-pet .dog-head {
            animation: none;
            transform: scale(0.95) translateY(8px);
        }

        /* --- PANTING STATE --- */
        .dog-container.panting {
            animation: pant-body 0.3s infinite ease-in-out;
        }
        @keyframes pant-body {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03, 0.96); }
        }

        .dog-container.panting .dog-head {
            animation: pant-head 0.3s infinite ease-in-out;
        }
        @keyframes pant-head {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px) scale(0.98); }
        }

        .dog-container.panting .tongue {
            animation: pant-tongue 0.15s infinite alternate ease-in-out;
        }
        @keyframes pant-tongue {
            0% { transform: translateX(-50%) scaleY(1.3); }
            100% { transform: translateX(-50%) scaleY(1.8) translateY(3px); }
        }

        /* --- TRICK ANIMATION --- */
        /* Stands on back legs, stretches tall from bottom-center origin, and wiggles cutely */
        @keyframes trick-stand {
            0% { transform: translateX(-50%) scale(2) rotate(0deg); }
            15% { transform: translateX(-50%) scale(1.8, 2.3) rotate(-6deg); } /* Stands tall, tilts left */
            35% { transform: translateX(-50%) scale(1.8, 2.3) rotate(6deg); }  /* Tilts right */
            55% { transform: translateX(-50%) scale(1.8, 2.3) rotate(-6deg); } /* Tilts left */
            75% { transform: translateX(-50%) scale(1.8, 2.3) rotate(6deg); }  /* Tilts right */
            90% { transform: translateX(-50%) scale(2) rotate(0deg); }         /* Returns to normal */
            100% { transform: translateX(-50%) scale(2) rotate(0deg); }
        }

        .dog-scaler.stand-trick {
            animation: trick-stand 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- DYNAMIC LEG ELONGATION --- */
        /* When the stand-trick is active on the parent, animate the paws to stretch into supporting legs */
        .stand-trick .paw {
            animation: leg-stretch 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes leg-stretch {
            0% { 
                height: 25px; 
                bottom: -5px; 
            }
            15% { 
                height: 52px; /* Stretch paw into a tall hind leg */
                bottom: -22px; /* Push downward from body structure */
                border-radius: 15px 15px 12px 12px;
            }
            35% { 
                height: 55px; 
                bottom: -24px; /* Sway extension */
            }
            55% { 
                height: 52px; 
                bottom: -22px; 
            }
            75% { 
                height: 55px; 
                bottom: -24px; 
            }
            90%, 100% { 
                height: 25px; 
                bottom: -5px; 
                border-radius: 15px 15px 10px 10px;
            }
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            border: 4px solid #222222;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 22px;
            font-weight: bold;
            color: #222222;
            white-space: nowrap;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            z-index: 100;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bubble default idle animation */
        .speech-bubble.idle-animate {
            animation: css-bubble 20s infinite ease-in-out;
        }

        @keyframes css-bubble {
            0%, 90%, 100% { transform: translateX(-50%) scale(0); }
            91%, 96% { transform: translateX(-50%) scale(1); }
        }

        /* Active class to override and force the speech bubble visible */
        .speech-bubble.active {
            animation: none !important;
            transform: translateX(-50%) scale(1.15) !important;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -17px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 14px 0;
            border-style: solid;
            border-color: #222222 transparent;
            display: block;
            width: 0;
            z-index: -1;
        }

        /* --- CARTOONY WATER BOWL --- */
        .bowl-container {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            margin-left: -240px; 
            width: 82px;
            height: 42px;
            background-color: #ff5e5e; 
            border: 4px solid #8b1e1e;
            border-radius: 0 0 40px 40px;
            /* Z-index increased to 15 to stay on top of the dog */
            z-index: 15;
            opacity: 0;
            transform: scale(0);
            transform-origin: bottom center;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bowl-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0 0 32px 32px;
            overflow: hidden; 
        }

        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3498db;
            transform-origin: bottom center;
            transform: scaleY(1); 
        }

        .bowl-container.show {
            opacity: 1;
            transform: scale(1.5); 
        }

        .bowl-container.empty-water .water {
            transform: scaleY(0); 
            transition: transform 2.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- CARTOONY TREAT BONE --- */
        .bone-container {
            position: absolute;
            bottom: 250px;
            left: 100px;
            /* Z-index increased to 15 to stay on top of the dog */
            z-index: 15;
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .bone-container.thrown {
            opacity: 1;
            bottom: 16%;
            left: 50%;
            margin-left: -200px; 
            transform: scale(1.6) rotate(360deg); 
        }

        /* Bone eating stages */
        .bone-mask {
            width: 70px;
            height: 35px;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        /* --- CARTOONY THROWN BALL --- */
        .toy-ball {
            position: absolute;
            bottom: 15%;
            left: 42%;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #ff5252 0%, #ff1a1a 40%, #b30000 85%);
            border: 3px solid #222;
            border-radius: 50%;
            /* Z-index set to 15 to match bowl and bone layered priorities */
            z-index: 15;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        /* Faster ball arc-throw, rotation, and rolling physics COMPLETELY OFF-SCREEN */
        @keyframes throw-ball-arc {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            30% {
                transform: translate(25vw, -150px) scale(1.1) rotate(270deg);
            }
            60% {
                transform: translate(50vw, -5px) scale(0.9) rotate(540deg);
            }
            75% {
                transform: translate(70vw, -15px) scale(0.8) rotate(720deg);
                opacity: 1;
            }
            99% {
                opacity: 1;
            }
            100% {
                opacity: 0; /* Fully disappears */
                transform: translate(110vw, 0px) scale(0.7) rotate(1440deg); /* Forces the ball off-screen past the viewport */
            }
        }

        .toy-ball.thrown {
            animation: throw-ball-arc 0.8s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        }

        /* --- 2x CARTOONY PETTING HAND --- */
        .pet-hand-container {
            position: absolute;
            bottom: 100%; 
            left: 50%;
            margin-left: -160px; 
            width: 200px; 
            height: 200px; 
            z-index: 20; /* Keep petting hand on top of everything */
            pointer-events: none;
            opacity: 0;
            transform: rotate(-15deg);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hand lands physically touching the dog's head */
        .pet-hand-container.active {
            opacity: 1;
            bottom: calc(10% + 280px); 
        }

        .pet-hand-container.patting {
            animation: hand-pat-animation 0.5s infinite ease-in-out;
        }

        @keyframes hand-pat-animation {
            0%, 100% { transform: translateY(0) rotate(-15deg); }
            50% { transform: translateY(22px) rotate(-10deg); }
        }

        /* --- BUTTON PANELS (Width increased 40%) --- */
        .button-panel {
            position: absolute;
            top: 0;
            height: 100%;
            width: 252px; /* Was 180px */
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 35px; /* Was 25px */
            padding: 20px;
            z-index: 10;
        }

        .button-panel.left { left: 0; }
        .button-panel.right { right: 0; }

        /* ALL BUTTONS (Height increased 40%) */
        .game-btn {
            width: 100%;
            height: 119px; /* Was 85px */
            transform: scale(1.08); 
            background-color: #ffffff;
            border: 5px solid #4a4a4a;
            border-radius: 15px;
            box-shadow: 0 6px 0 #333333;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-size: 21px; /* Was 15px */
            font-weight: bold;
            color: #4a4a4a;
            
            /* Align icon and text side-by-side beautifully using Flexbox */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 17px; /* Was 12px */
            gap: 14px; /* Was 10px */
            box-sizing: border-box;
        }

        /* Keep icon aligned and scaled proportionally (Size increased 40%) */
        .btn-icon {
            width: 49px; /* Was 35px */
            height: 49px; /* Was 35px */
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        /* Micro-animation: make icons slightly pop when hovering */
        .game-btn:hover .btn-icon {
            transform: scale(1.15);
        }

        .game-btn:active {
            transform: scale(1.05) translateY(4px) !important;
            box-shadow: 0 2px 0 #333333 !important;
        }

        /* CUSTOMIZED BUTTONS styling nuances */
        .btn-water {
            color: #1a5276;
            background-color: #ebf5fb;
            border-color: #2980b9;
            box-shadow: 0 6px 0 #1f618d;
        }
        .btn-water:active { box-shadow: 0 2px 0 #1f618d !important; }

        .btn-walk {
            color: #27ae60;
            background-color: #e8f8f5;
            border-color: #2ecc71;
            box-shadow: 0 6px 0 #27ae60;
        }
        .btn-walk:active { box-shadow: 0 2px 0 #27ae60 !important; }

        .btn-treat {
            color: #7e5109;
            background-color: #fef9e7;
            border-color: #f39c12;
            box-shadow: 0 6px 0 #b7950b;
        }
        .btn-treat:active { box-shadow: 0 2px 0 #b7950b !important; }

        .btn-pet {
            color: #5b2c6f;
            background-color: #f4ecf7;
            border-color: #8e44ad;
            box-shadow: 0 6px 0 #6c3483;
        }
        .btn-pet:active { box-shadow: 0 2px 0 #6c3483 !important; }

        .btn-ball {
            color: #d35400;
            background-color: #fdf2e9;
            border-color: #e67e22;
            box-shadow: 0 6px 0 #d35400;
        }
        .btn-ball:active { box-shadow: 0 2px 0 #d35400 !important; }

        .btn-trick {
            color: #117a65;
            background-color: #e8f8f5;
            border-color: #16a085;
            box-shadow: 0 6px 0 #117a65;
        }
        .btn-trick:active { box-shadow: 0 2px 0 #117a65 !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="sun"></div>
        
        <div class="grass-clump bg-grass-1">
            <div class="blade blade-left"></div>
            <div class="blade blade-center"></div>
            <div class="blade blade-right"></div>
        </div>
        <div class="grass-clump bg-grass-2">
            <div class="blade blade-left"></div>
            <div class="blade blade-center"></div>
            <div class="blade blade-right"></div>
        </div>

        <div class="fence">
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
        </div>
        
        <div class="grass"></div>

        <div class="grass-clump fg-grass-1">
            <div class="blade blade-left"></div>
            <div class="blade blade-center"></div>
            <div class="blade blade-right"></div>
        </div>
        <div class="grass-clump fg-grass-2">
            <div class="blade blade-left"></div>
            <div class="blade blade-center"></div>
            <div class="blade blade-right"></div>
        </div>

        <!-- LEFT CONTROL PANEL -->
        <div class="button-panel left">
            <button class="game-btn btn-water" id="waterBtn">
                <img src="water.png" alt="Water Bowl" class="btn-icon">
                Give water
            </button>
            <button class="game-btn btn-walk" id="walkBtn">
                <img src="walk.png" alt="Walk Leash" class="btn-icon">
                Take on a walk
            </button>
            <button class="game-btn btn-treat" id="treatBtn">
                <img src="treat.png" alt="Treat Bone" class="btn-icon">
                Treat
            </button>
        </div>

        <div class="toy-ball" id="toyBall"></div>

        <div class="pet-hand-container" id="petHand">
            <svg viewBox="0 0 100 100" width="200" height="200">
                <path d="M 80 0 L 100 20 L 75 45 L 55 25 Z" fill="#34495e" stroke="#2c3e50" stroke-width="4"/>
                <path d="M 55 25 L 75 45 L 70 50 L 50 30 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/>
                <path d="M 50 30 C 40 20, 25 30, 30 42 C 22 35, 12 45, 20 54 C 15 52, 5 62, 15 72 C 20 77, 35 77, 45 68 C 50 63, 58 55, 52 42 Z" fill="#f5cba7" stroke="#d35400" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 46 36 C 52 28, 62 38, 50 46" fill="none" stroke="#d35400" stroke-width="4"/>
            </svg>
        </div>

        <!-- Custom Bowl (Layers beautifully in front of the dog now) -->
        <div class="bowl-container" id="waterBowl">
            <div class="bowl-inner">
                <div class="water"></div>
            </div>
        </div>

        <!-- Custom Treat Bone (Layers beautifully in front of the dog now) -->
        <div class="bone-container" id="treatBone">
            <div class="bone-mask" id="boneMask">
                <svg viewBox="0 0 100 50" width="70" height="35" style="display: block;">
                    <path d="M 25 15 L 75 15 C 85 5, 95 15, 85 25 C 95 35, 85 45, 75 35 L 25 35 C 15 45, 5 35, 15 25 C 5 15, 15 5, 25 15 Z" fill="#f5eedc" stroke="#8a7355" stroke-width="5" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="dog-scaler" id="dogScaler">
            <div class="dog-container" id="dog">
                <div class="tail"></div>
                
                <div class="dog-body">
                    <div class="paw left"></div>
                    <div class="paw right"></div>
                </div>

                <div class="collar"></div>
                
                <div class="speech-bubble idle-animate" id="speechBubble">Woof! Woof!</div>

                <div class="dog-head">
                    <div class="ear left"></div>
                    <div class="ear right"></div>
                    
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="snout">
                        <div class="nose"></div>
                        <div class="tongue"></div>
                        <div class="held-ball"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT CONTROL PANEL -->
        <div class="button-panel right">
            <button class="game-btn btn-pet" id="petBtn">
                <img src="pet.png" alt="Pet Hand" class="btn-icon">
                Pet
            </button>
            <button class="game-btn btn-ball" id="ballBtn">
                <img src="ball.png" alt="Ball" class="btn-icon">
                Throw Ball
            </button>
            <button class="game-btn btn-trick" id="trickBtn">
                <img src="trick.png" alt="Trick Star" class="btn-icon">
                Do a trick
            </button>
        </div>
    </div>

    <script>
        const waterBtn = document.getElementById('waterBtn');
        const walkBtn = document.getElementById('walkBtn');
        const treatBtn = document.getElementById('treatBtn');
        const petBtn = document.getElementById('petBtn');
        const ballBtn = document.getElementById('ballBtn');
        const trickBtn = document.getElementById('trickBtn');
        
        const waterBowl = document.getElementById('waterBowl');
        const treatBone = document.getElementById('treatBone');
        const boneMask = document.getElementById('boneMask');
        const petHand = document.getElementById('petHand');
        const toyBall = document.getElementById('toyBall');
        const dogScaler = document.getElementById('dogScaler');
        const dog = document.getElementById('dog');
        const speechBubble = document.getElementById('speechBubble');
        let isBusy = false;

        // --- WATER EVENT ---
        waterBtn.addEventListener('click', () => {
            if (isBusy) return; 
            isBusy = true;

            dog.classList.remove('panting');
            waterBowl.classList.remove('empty-water');
            waterBowl.classList.add('show');

            setTimeout(() => {
                dog.classList.add('drinking');
                
                setTimeout(() => {
                    waterBowl.classList.add('empty-water');
                }, 300);

                setTimeout(() => {
                    dog.classList.remove('drinking');
                    waterBowl.classList.remove('show');
                    
                    setTimeout(() => {
                        isBusy = false;
                    }, 400);
                }, 2800);

            }, 400);
        });

        // --- WALK EVENT ---
        walkBtn.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            dog.classList.remove('panting');
            dog.classList.add('walking');

            // Force normal 2s walk transition
            dogScaler.style.transition = "transform 2s ease-in-out, bottom 2s ease-in-out, left 2s ease-in-out, opacity 0.3s ease";

            // Phase 1: Walk to the back-left (decreases in scale to 1.1 to show distance)
            dog.classList.add('walk-left');
            dog.classList.remove('walk-right');
            
            dogScaler.style.bottom = "43%"; // Up near the fence horizon
            dogScaler.style.left = "20%";   // Far left side
            dogScaler.style.transform = "translateX(-50%) scale(1.1)"; 

            // Phase 2: After 2 seconds, walk to the back-right (maintains small scale)
            setTimeout(() => {
                dog.classList.remove('walk-left');
                dog.classList.add('walk-right');
                dogScaler.style.left = "80%";   // Far right side
                dogScaler.style.transform = "translateX(-50%) scale(1.1)"; 
            }, 2000);

            // Phase 3: After 4 seconds, walk back to origin, scaling back up to 2x smoothly
            setTimeout(() => {
                dog.classList.remove('walk-right');
                dog.classList.add('walk-left');
                dogScaler.style.bottom = "10%"; // Back down to foreground origin
                dogScaler.style.left = "50%";   // Centered
                dogScaler.style.transform = "translateX(-50%) scale(2)"; 
            }, 4000);

            // Phase 4: Arrive back home, stop walking, and pant happily
            setTimeout(() => {
                dog.classList.remove('walk-left');
                dogScaler.style.transform = "translateX(-50%) scale(2)"; 
                dog.classList.remove('walking');
                dog.classList.add('panting');
                
                setTimeout(() => {
                    isBusy = false;
                }, 500);
            }, 6000);
        });

        // --- TREAT EVENT ---
        treatBtn.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            dog.classList.remove('panting');
            boneMask.style.width = "70px";

            treatBone.className = "bone-container";
            void treatBone.offsetWidth; 
            treatBone.classList.add('thrown');

            setTimeout(() => {
                dog.classList.add('eating');

                setTimeout(() => {
                    boneMask.style.width = "48px";
                }, 350);

                setTimeout(() => {
                    boneMask.style.width = "24px";
                }, 800);

                setTimeout(() => {
                    boneMask.style.width = "0px";
                }, 1200);

                setTimeout(() => {
                    dog.classList.remove('eating');

                    dog.classList.add('barking');
                    speechBubble.textContent = "Bark!";
                    speechBubble.classList.remove('idle-animate');
                    speechBubble.classList.add('active');

                    setTimeout(() => {
                        dog.classList.remove('barking');
                        speechBubble.classList.remove('active');
                        speechBubble.classList.add('idle-animate');
                        speechBubble.textContent = "Woof! Woof!";
                        
                        treatBone.className = "bone-container";
                        boneMask.style.width = "70px";
                        isBusy = false;
                    }, 1500);

                }, 1400);

            }, 800);
        });

        // --- PET EVENT ---
        petBtn.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            dog.classList.remove('panting');
            petHand.classList.add('active');
            
            setTimeout(() => {
                petHand.classList.add('patting');
                dog.classList.add('happy-pet');
            }, 600);

            setTimeout(() => {
                petHand.classList.remove('patting');
                petHand.classList.remove('active');
                dog.classList.remove('happy-pet');

                setTimeout(() => {
                    dog.classList.add('barking');
                    speechBubble.textContent = "Woof!";
                    speechBubble.classList.remove('idle-animate');
                    speechBubble.classList.add('active');

                    setTimeout(() => {
                        dog.classList.remove('barking');
                        speechBubble.classList.remove('active');
                        speechBubble.classList.add('idle-animate');
                        speechBubble.textContent = "Woof! Woof!";
                        isBusy = false;
                    }, 1200);

                }, 200);

            }, 2800);
        });

        // --- THROW BALL EVENT ---
        ballBtn.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            dog.classList.remove('panting');

            // Temporarily quicken transitions to 0.8s for an energetic dash!
            dogScaler.style.transition = "transform 0.8s ease-in-out, bottom 0.8s ease-in-out, left 0.8s ease-in-out, opacity 0.3s ease";

            // 1. Throw the ball
            toyBall.classList.add('thrown');

            // 2. Dog tracks ball, turns, and dashes off-screen to chase it
            setTimeout(() => {
                dog.classList.add('walking');
                dogScaler.style.transform = "translateX(-50%) scale(2)";
                
                // Dash off-screen to retrieve it (takes 0.8 seconds to complete)
                setTimeout(() => {
                    dogScaler.style.left = "130%"; 
                    dogScaler.style.bottom = "20%"; // Depth run
                    dogScaler.style.transform = "translateX(-50%) scale(1.6)"; 
                }, 50);

            }, 300); 

            // 3. Retrieve ball off-screen (make thrown ball vanish and add held ball to dog mouth)
            setTimeout(() => {
                toyBall.style.opacity = "0";
                toyBall.classList.remove('thrown');
                dog.classList.add('holding-ball');
                
                dogScaler.style.transform = "translateX(-50%) scale(1.6)"; 
            }, 1100); // Wait for the dash to fully complete off-screen

            // 4. Dog runs back to original spot with ball in its mouth
            setTimeout(() => {
                dogScaler.style.left = "50%";
                dogScaler.style.bottom = "10%";
                dogScaler.style.transform = "translateX(-50%) scale(2)"; // Re-scale back to 2x as he returns
            }, 1300);

            // 5. Arrive back home, drop the ball, and happily bark!
            setTimeout(() => {
                dog.classList.remove('walking');

                // Restore default slow 2s transitions for normal strolls
                dogScaler.style.transition = "transform 2s ease-in-out, bottom 2s ease-in-out, left 2s ease-in-out, opacity 0.3s ease";

                setTimeout(() => {
                    // Drop the ball
                    dog.classList.remove('holding-ball');

                    // Bark excitedly!
                    dog.classList.add('barking');
                    speechBubble.textContent = "Woof!";
                    speechBubble.classList.remove('idle-animate');
                    speechBubble.classList.add('active');

                    setTimeout(() => {
                        // Reset all properties to normal idle
                        dog.classList.remove('barking');
                        speechBubble.classList.remove('active');
                        speechBubble.classList.add('idle-animate');
                        speechBubble.textContent = "Woof! Woof!";
                        toyBall.style.opacity = ""; // Reset style opacity
                        
                        isBusy = false;
                    }, 1200);
                }, 500);

            }, 2200); // Let returning walk animation finish completely
        });

        // --- DO A TRICK EVENT ---
        trickBtn.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            dog.classList.remove('panting');

            // Set stand trick duration
            let duration = 1400; 

            // Stand up on hind legs, stretch paws, and wiggle!
            dogScaler.classList.add('stand-trick');
            speechBubble.textContent = "Look at me!";

            // Bring up the speech bubble during the trick
            speechBubble.classList.remove('idle-animate');
            speechBubble.classList.add('active');

            // Once the trick completes, clean up the animation classes and happy bark!
            setTimeout(() => {
                dogScaler.className = "dog-scaler"; // Clears trick classes
                
                // Transition into a happy celebratory bark
                dog.classList.add('barking');
                speechBubble.textContent = "Woof! Woof!";

                setTimeout(() => {
                    dog.classList.remove('barking');
                    speechBubble.classList.remove('active');
                    speechBubble.classList.add('idle-animate');
                    dog.classList.add('panting'); // Pants happily after doing work!
                    
                    isBusy = false;
                }, 1200);

            }, duration);
        });
    </script>
</body>
</html>
