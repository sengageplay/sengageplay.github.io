<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Finger - Cause & Effect</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* --- RESPONSIVE SIDEBAR MENU --- */
        #sidebar {
            position: absolute;
            z-index: 20;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #333;
            display: flex;
            gap: 12px;
            transition: all 0.3s ease;
        }

        /* DESKTOP & LANDSCAPE (Left Side Vertical) */
        @media (min-width: 601px) or (orientation: landscape) {
            #sidebar {
                top: 50%;
                left: 15px;
                transform: translateY(-50%);
                flex-direction: column;
                padding: 12px;
                border-radius: 24px;
            }

            .menu-btn {
                width: min(110px, 12vh);
                height: min(110px, 12vh);
            }
        }

        /* MOBILE PORTRAIT (Bottom Horizontal Bar) */
        @media (max-width: 600px) and (orientation: portrait) {
            #sidebar {
                bottom: 15px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                padding: 10px 14px;
                border-radius: 24px;
            }

            .menu-btn {
                width: clamp(55px, 18vw, 75px);
                height: clamp(55px, 18vw, 75px);
            }
        }

        /* --- MENU BUTTONS --- */
        .menu-btn {
            border-radius: 20px;
            border: 3px solid #444;
            background-color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: transform 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .menu-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .menu-btn.active {
            border-color: #77DDFF;
            background-color: #333333;
            box-shadow: 0 0 15px rgba(119, 221, 255, 0.7);
            transform: scale(1.05);
        }

        .menu-btn:active {
            transform: scale(0.92);
        }

        /* Gentle "Touch" PECS Prompt Overlay */
        #touch-prompt {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        #touch-prompt.hidden {
            opacity: 0;
        }

        .pecs-prompt-icon {
            width: clamp(80px, 20vw, 130px);
            height: clamp(80px, 20vw, 130px);
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- PECS Selection Sidebar (Responsive) -->
<div id="sidebar">
    <button class="menu-btn active" onclick="setMode('bubbles', this)" title="Bubbles">
        <img src="bubbles.png" alt="Bubbles">
    </button>
    <button class="menu-btn" onclick="setMode('water', this)" title="Water">
        <img src="water.png" alt="Water">
    </button>
    <button class="menu-btn" onclick="setMode('sand', this)" title="Sand">
        <img src="sand.png" alt="Sand">
    </button>
    <button class="menu-btn" onclick="setMode('star', this)" title="Star">
        <img src="star.png" alt="Star">
    </button>
</div>

<!-- PECS Prompt Image -->
<div id="touch-prompt">
    <img src="touch.png" alt="Touch PECS Prompt" class="pecs-prompt-icon">
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const promptElem = document.getElementById('touch-prompt');

    let audioCtx = null;
    let idleTimer = null;
    let particles = [];
    let isDragging = false;
    let lastDragPos = { x: 0, y: 0 };
    let activeMode = 'bubbles';

    const BUBBLE_PALETTE = ['#77DDFF', '#FF99C8', '#FCF6BD', '#B9FBC0', '#E0C3FC', '#FFD6A5'];
    const SAND_PALETTE = ['#F4C430', '#E5A93C', '#D4AF37', '#FFD700', '#C58F27', '#B8860B'];
    const WATER_PALETTE = ['#00B4D8', '#90E0EF', '#0077B6', '#48CAE4', '#CAF0F8', '#00F0FF'];
    const STAR_PALETTE = ['#FFD166', '#FFB703', '#FFF176', '#FF9F1C', '#FFFFFF'];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));
    resize();

    function setMode(mode, btnElem) {
        activeMode = mode;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElem) btnElem.classList.add('active');
    }

    /* --- AUDIO SYNTHESIS --- */
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playAudioTone(mode) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (mode === 'bubbles') {
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
            const startFreq = notes[Math.floor(Math.random() * notes.length)];
            osc.type = 'sine';
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(startFreq * 1.25, now + 0.8);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.start(now);
            osc.stop(now + 0.8);
        } else if (mode === 'water') {
            const freq = 550 + Math.random() * 350;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.35, now + 0.25);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (mode === 'sand') {
            const freq = 140 + Math.random() * 80;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.08, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (mode === 'star') {
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            const freq = notes[Math.floor(Math.random() * notes.length)];
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            osc.start(now);
            osc.stop(now + 0.9);
        }
    }

    /* --- OBJECT SPAWNING --- */
    function spawnObject(x, y) {
        initAudio();

        if (Math.random() < 0.6) {
            playAudioTone(activeMode);
        }

        promptElem.classList.add('hidden');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            promptElem.classList.remove('hidden');
        }, 5000);

        // Adjust particle scaling dynamically for mobile screens
        const mobileScale = window.innerWidth < 600 ? 0.75 : 1.0;

        if (activeMode === 'bubbles') {
            const color = BUBBLE_PALETTE[Math.floor(Math.random() * BUBBLE_PALETTE.length)];
            const size = (Math.random() * 25 + 20) * mobileScale;
            particles.push({
                type: 'bubble',
                x: x + (Math.random() * 20 - 10),
                y: y + (Math.random() * 20 - 10),
                radius: size,
                maxRadius: (size + Math.random() * 40 + 30) * mobileScale,
                color: color,
                vx: (Math.random() - 0.5) * 1.2,
                vy: -(Math.random() * 1.5 + 0.8),
                alpha: 1.0,
                shimmer: Math.random() * Math.PI
            });
        } else if (activeMode === 'water') {
            for (let i = 0; i < 10; i++) {
                const isMainDrop = Math.random() > 0.35;
                particles.push({
                    type: 'water',
                    x: x + (Math.random() * 24 - 12),
                    y: y + (Math.random() * 10 - 5),
                    radius: (isMainDrop ? (Math.random() * 7 + 6) : (Math.random() * 3.5 + 2)) * mobileScale,
                    color: WATER_PALETTE[Math.floor(Math.random() * WATER_PALETTE.length)],
                    vx: (Math.random() - 0.5) * 5,
                    vy: -(Math.random() * 8 + 5),
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: Math.random() * 0.12 + 0.04,
                    alpha: 0.9
                });
            }
        } else if (activeMode === 'sand') {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    type: 'sand',
                    x: x + (Math.random() * 36 - 18),
                    y: y + (Math.random() * 12 - 6),
                    radius: (Math.random() * 3.5 + 2.5) * mobileScale,
                    color: SAND_PALETTE[Math.floor(Math.random() * SAND_PALETTE.length)],
                    vx: (Math.random() - 0.5) * 3,
                    vy: Math.random() * 6 + 4,
                    alpha: 1.0
                });
            }
        } else if (activeMode === 'star') {
            particles.push({
                type: 'star',
                x: x + (Math.random() * 20 - 10),
                y: y + (Math.random() * 20 - 10),
                radius: (Math.random() * 25 + 20) * mobileScale,
                color: STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)],
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5 - 0.5,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.08,
                alpha: 1.0
            });
        }
    }

    /* --- HELPERS --- */
    function drawStarShape(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = (Math.PI / 2) * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
    }

    /* --- MAIN ANIMATION LOOP --- */
    function animate() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];

            if (p.type === 'bubble') {
                p.x += p.vx;
                p.y += p.vy;
                if (p.radius < p.maxRadius) p.radius += 0.3;
                p.alpha -= 0.006;
                p.shimmer += 0.03;

                if (p.alpha <= 0) { particles.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha * 0.15);
                ctx.fill();

                ctx.globalAlpha = Math.max(0, p.alpha * 0.6);
                ctx.beginPath();
                const hx = p.x - p.radius * 0.3;
                const hy = p.y - p.radius * 0.3;
                const hr = p.radius * 0.25 + Math.sin(p.shimmer) * 2;
                ctx.arc(hx, hy, Math.max(2, hr), 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();

                ctx.restore();
            } 
            else if (p.type === 'water') {
                p.x += p.vx + Math.sin(p.wobble) * 0.9;
                p.wobble += p.wobbleSpeed;
                p.vy += 0.38;
                p.y += p.vy;
                p.vx *= 0.98;
                p.alpha -= 0.01;

                if (p.alpha <= 0 || p.y > canvas.height + 40) { particles.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                ctx.fill();

                ctx.restore();
            } 
            else if (p.type === 'sand') {
                p.x += p.vx;
                p.vy += 0.35;
                p.y += p.vy;
                p.alpha -= 0.01;

                if (p.alpha <= 0 || p.y > canvas.height) { particles.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } 
            else if (p.type === 'star') {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.alpha -= 0.006;

                if (p.alpha <= 0) { particles.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);

                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 18;

                drawStarShape(ctx, 0, 0, 5, p.radius, p.radius * 0.45);
                ctx.fill();
                ctx.restore();
            }
        }

        requestAnimationFrame(animate);
    }

    /* --- CONTROLS --- */
    function handleStart(x, y) {
        // Prevent drawing if touching the menu bar
        const sidebar = document.getElementById('sidebar');
        const rect = sidebar.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            return;
        }

        isDragging = true;
        lastDragPos = { x, y };
        spawnObject(x, y);
    }

    function handleMove(x, y) {
        if (!isDragging) return;
        const dist = Math.hypot(x - lastDragPos.x, y - lastDragPos.y);
        if (dist > 15) {
            spawnObject(x, y);
            lastDragPos = { x, y };
        }
    }

    function handleEnd() {
        isDragging = false;
    }

    canvas.addEventListener('pointerdown', (e) => handleStart(e.clientX, e.clientY));
    canvas.addEventListener('pointermove', (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener('pointerup', handleEnd);
    window.addEventListener('pointercancel', handleEnd);

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            spawnObject(canvas.width / 2, canvas.height / 2);
        }
    });

    animate();
</script>

</body>
</html>
