<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Feeding Game</title>
  <style>
    :root {
      /* Easily adjust animal & food card dimensions here */
      --animal-card-size: 220px;
      --food-card-size: 160px; /* Adjust size as needed (e.g., 120px, 160px, 180px) */
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a8e6cf, #dbede6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
    }

    header {
      margin-top: 20px;
      text-align: center;
    }

    h1 {
      color: #2d5a27;
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }

    .score-board {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      flex-grow: 1;
    }

    /* Animal Display Zone */
    .animal-card {
      width: var(--animal-card-size);
      height: var(--animal-card-size);
      background: #ffffff;
      border: 6px solid #4caf50;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 40px;
      transition: transform 0.2s ease;
    }

    .animal-card img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .message {
      font-size: 1.8rem;
      font-weight: bold;
      height: 40px;
      margin-bottom: 20px;
      text-align: center;
    }

    .message.correct { color: #2e7d32; }
    .message.wrong { color: #c62828; }

    /* Food Options Zone */
    .food-options {
      display: flex;
      gap: 20px;
      justify-content: center;
      width: 100%;
      padding: 0 20px;
    }

    .food-card {
      width: var(--food-card-size);
      height: var(--food-card-size);
      background: #ffffff;
      border: 4px solid #ff9800;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    .food-card:hover, .food-card:focus {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    .food-card img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    /* Animations */
    .bounce {
      animation: bounce 0.5s ease;
    }

    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-12px); }
      75% { transform: translateX(12px); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Feed the Animals!</h1>
    <div class="score-board">Score: <span id="score">0</span></div>
  </header>

  <div class="game-container">
    <div class="animal-card" id="animalCard">
      <img id="animalImg" src="" alt="Animal">
    </div>

    <div class="message" id="message" aria-live="polite"></div>

    <div class="food-options" id="foodOptions">
      <div class="food-card" tabindex="0" role="button" onclick="checkFood(0)" onkeydown="if(event.key==='Enter'||event.key===' ')checkFood(0)">
        <img id="foodImg0" src="" alt="Food Option 1">
      </div>
      <div class="food-card" tabindex="0" role="button" onclick="checkFood(1)" onkeydown="if(event.key==='Enter'||event.key===' ')checkFood(1)">
        <img id="foodImg1" src="" alt="Food Option 2">
      </div>
      <div class="food-card" tabindex="0" role="button" onclick="checkFood(2)" onkeydown="if(event.key==='Enter'||event.key===' ')checkFood(2)">
        <img id="foodImg2" src="" alt="Food Option 3">
      </div>
    </div>
  </div>

  <script>
    const TOTAL_ANIMALS = 12;

    const animalFoodPairs = [];
    for (let i = 1; i <= TOTAL_ANIMALS; i++) {
      animalFoodPairs.push({
        animalImg: `png${i}.png`,
        correctFoodImg: `png${i + 12}.png`,
        id: i
      });
    }

    let currentAnimal = null;
    let currentOptions = [];
    let score = 0;
    let isWaiting = false;

    // Fisher-Yates (Durstenfeld) Shuffle Algorithm
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function preloadImages() {
      for (let i = 1; i <= TOTAL_ANIMALS * 2; i++) {
        const img = new Image();
        img.src = `png${i}.png`;
      }
    }

    function startNewRound() {
      isWaiting = false;
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = 'message';

      // Pick random animal
      const randomIndex = Math.floor(Math.random() * animalFoodPairs.length);
      currentAnimal = animalFoodPairs[randomIndex];

      document.getElementById('animalImg').src = currentAnimal.animalImg;

      // Prepare food options using Fisher-Yates shuffle
      const correctFood = currentAnimal.correctFoodImg;

      const wrongFoods = animalFoodPairs
        .filter(pair => pair.id !== currentAnimal.id)
        .map(pair => pair.correctFoodImg);

      shuffleArray(wrongFoods);
      const selectedWrong = wrongFoods.slice(0, 2);

      currentOptions = shuffleArray([correctFood, ...selectedWrong]);

      for (let i = 0; i < 3; i++) {
        document.getElementById(`foodImg${i}`).src = currentOptions[i];
      }
    }

    function checkFood(selectedIndex) {
      if (isWaiting) return;

      const chosenFood = currentOptions[selectedIndex];
      const messageElem = document.getElementById('message');
      const animalCard = document.getElementById('animalCard');

      if (chosenFood === currentAnimal.correctFoodImg) {
        isWaiting = true;
        score += 10;
        document.getElementById('score').textContent = score;

        messageElem.textContent = 'Yum! Great Job! 🎉';
        messageElem.className = 'message correct';

        animalCard.classList.add('bounce');
        setTimeout(() => animalCard.classList.remove('bounce'), 500);

        setTimeout(startNewRound, 1500);
      } else {
        messageElem.textContent = 'Oops! Try again! 😋';
        messageElem.className = 'message wrong';

        animalCard.classList.add('shake');
        setTimeout(() => animalCard.classList.remove('shake'), 400);
      }
    }

    preloadImages();
    startNewRound();
  </script>
</body>
</html>
