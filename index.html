<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTapSEN - Games for SEND Children</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214; /* Calming, low-distraction dark background */
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px 20px;
            background-color: #1a1a1e;
            border-bottom: 4px solid #4ade80; /* Friendly green accent anchor */
        }

        header h1 {
            margin: 0;
            font-size: 2.6rem;
            color: #ffffff;
        }

        header p {
            margin: 8px 0 0;
            color: #a1a1aa;
            font-size: 1.3rem;
            font-weight: 500;
        }

        /* Fixed 4-column Grid Layout */
        .arcade-grid {
            display: grid;
            /* Force exactly 4 columns on larger screens, scaling down to 2 or 1 on small phones */
            grid-template-columns: repeat(4, 1fr);
            gap: 25px; /* Slightly wider gap for larger tiles */
            max-width: 1000px; /* Snugs the grid neatly in the middle of the screen */
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Responsive tweak for smaller screens (tablets/phones) */
        @media (max-width: 768px) {
            .arcade-grid {
                grid-template-columns: repeat(2, 1fr); /* 2-column grid on mobile */
            }
        }

        .game-card {
            background-color: #ffffff; /* Clean white card background to match PECS style */
            border-radius: 20px; /* Slightly rounder edges for larger tiles */
            overflow: hidden;
            text-decoration: none;
            border: 5px solid #27272a; /* Thicker border for a chunky, satisfying feel */
            transition: transform 0.15s ease-in-out, border-color 0.15s ease-in-out;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            
            aspect-ratio: 1 / 1; /* Forces the card to stay a perfect square */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* High-contrast border feedback when highlighted or hovered */
        .game-card:hover, .game-card:focus {
            transform: scale(1.05);
            border-color: #4ade80; /* Turns bright green */
            outline: none;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the whole customized card fits perfectly inside */
            padding: 15px; /* Breathing room for the custom text/image */
            box-sizing: border-box;
            background-color: #ffffff;
        }

        footer {
            padding: 40px 20px;
            color: #71717a;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>TapTapSEN</h1>
        <p>Sensory & Learning Games for SEND Children</p>
    </header>

    <div class="arcade-grid">

        <!-- GAME CARD 1: Mediadeck -->
        <a href="mediadeck/" class="game-card">
            <img src="images/play.png" alt="Mediadeck Game">
        </a>

        <!-- GAME CARD 7: Help the Dog -->
        <a href="doggame/" class="game-card">
            <img src="images/helpthedog.png" alt="Help the Dog">
        </a>

        <!-- GAME CARD 10: Shape Sort -->
        <a href="shapesort/" class="game-card">
            <img src="images/Title card.png" alt="Shape Sort">
        </a>

        <!-- GAME CARD 11: Healthy Plate -->
        <a href="healthyplate/" class="game-card">
            <img src="images/gemini-svg.png" alt="Healthy Plate">
        </a>

        <!-- GAME CARD 13: Maze Rescue -->
        <a href="mazerescue/" class="game-card">
            <img src="images/mazerescuetitle.png" alt="Maze Rescue">
        </a>

        <!-- GAME CARD 14: Colour Splat -->
        <a href="coloursplat/" class="game-card">
            <img src="images/splattitle.png" alt="Colour Splat">
        </a>

        <!-- GAME CARD 15: Gift -->
        <a href="gift/" class="game-card">
            <img src="images/gift.png" alt="Gift Game">
        </a>

        <!-- GAME CARD 16: Fish -->
        <a href="fish/" class="game-card">
            <img src="images/fishtitle.png" alt="Fish Game">
        </a>

        <!-- GAME CARD 17: Shop -->
        <a href="shop/" class="game-card">
            <img src="images/shop.png" alt="Shop Game">
        </a>

        <!-- GAME CARD 18: Spell -->
        <a href="spell/" class="game-card">
            <img src="images/spell.png" alt="Spell Game">
        </a>

        <!-- GAME CARD 19: Circles -->
        <a href="circles/" class="game-card">
            <img src="images/circles.png" alt="Circles Game">
        </a>

        <!-- GAME CARD 20: Touch Shapes -->
        <a href="touchshapes/" class="game-card">
            <img src="images/touchshapes.png" alt="Touch Shapes Game">
        </a>

    </div>

    <footer>
        <p>© TapTapSEN — Simple, accessible learning for sensory minds.</p>
    </footer>

</body>
</html>
