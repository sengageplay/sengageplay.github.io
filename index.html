<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoneNowPlay — Simple Visual Learning Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214; /* Calming, low-distraction dark background */
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px 20px;
            background-color: #1a1a1e;
            border-bottom: 4px solid #4ade80; /* Friendly green accent anchor */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LOGO STYLING */
        .site-logo {
            max-width: 380px; /* Limits size on desktop */
            width: 100%;       /* Allows logo to shrink nicely on mobile */
            height: auto;
            margin-bottom: 10px;
            display: block;
        }

        header p {
            margin: 4px 0 0;
            color: #a1a1aa;
            font-size: 1.3rem;
            font-weight: 500;
        }

        /* Fixed 4-column Grid Layout */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Responsive tweak for smaller screens (tablets/phones) */
        @media (max-width: 768px) {
            .arcade-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .site-logo {
                max-width: 280px; /* Compact logo size for mobile screens */
            }
        }

        .game-card {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            border: 5px solid #27272a;
            transition: transform 0.15s ease-in-out, border-color 0.15s ease-in-out;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover, .game-card:focus {
            transform: scale(1.05);
            border-color: #4ade80;
            outline: none;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 15px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        footer {
            padding: 40px 20px;
            color: #71717a;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <!-- SITE LOGO PLACEHOLDER -->
        <img src="images/donenowplaylogo.png" alt="DoneNowPlay Logo" class="site-logo">
        <p>Simple symbol games for visual minds.</p>
    </header>

    <div class="arcade-grid">

        <!-- GAME CARD 1: Mediadeck -->
        <a href="mediadeck/" class="game-card">
            <img src="images/play.png" alt="Mediadeck Game">
        </a>

        <!-- GAME CARD 10: Shape Sort -->
        <a href="shapesort/" class="game-card">
            <img src="images/Title card.png" alt="Shape Sort">
        </a>

        <!-- GAME CARD 11: Healthy Plate -->
        <a href="healthyplate/" class="game-card">
            <img src="images/gemini-svg.png" alt="Healthy Plate">
        </a>

        <!-- GAME CARD 13: Maze Rescue -->
        <a href="mazerescue/" class="game-card">
            <img src="images/mazerescuetitle.png" alt="Maze Rescue">
        </a>

        <!-- GAME CARD 14: Colour Splat -->
        <a href="coloursplat/" class="game-card">
            <img src="images/splattitle.png" alt="Colour Splat">
        </a>

        <!-- GAME CARD 15: Gift -->
        <a href="gift/" class="game-card">
            <img src="images/gift.png" alt="Gift Game">
        </a>

        <!-- GAME CARD 16: Fish -->
        <a href="fish/" class="game-card">
            <img src="images/fishtitle.png" alt="Fish Game">
        </a>

        <!-- GAME CARD 17: Shop -->
        <a href="shop/" class="game-card">
            <img src="images/shop.png" alt="Shop Game">
        </a>

        <!-- GAME CARD 18: Spell -->
        <a href="spell/" class="game-card">
            <img src="images/spell.png" alt="Spell Game">
        </a>

        <!-- GAME CARD 19: Circles -->
        <a href="circles/" class="game-card">
            <img src="images/circles.png" alt="Circles Game">
        </a>

        <!-- GAME CARD 20: Touch Shapes -->
        <a href="touchshapes/" class="game-card">
            <img src="images/touchshapes.png" alt="Touch Shapes Game">
        </a>
        
        <!-- GAME CARD 21: Animal Feed -->
        <a href="animalfeed/" class="game-card">
            <img src="images/animalfeedtitlecard.png" alt="Feed the Animals game">
        </a>

        <!-- GAME CARD 22: Safari Match -->
        <a href="animalmatch/" class="game-card">
            <img src="images/safarimatchtitlecard.png" alt="Safari Match game">
        </a>

         <!-- GAME CARD 23: Weather Balloons -->
        <a href="weatherballoons/" class="game-card">
            <img src="images/weatherballoonstitlecard.png" alt="Weather Balloons game">
        </a>

         <!-- GAME CARD 24: transport stamp -->
        <a href="transportstamp/" class="game-card">
            <img src="images/transportstamptitlecard.png" alt="Transport Stamp game">
        </a>

        <!-- GAME CARD 25: animal stamp -->
        <a href="animalstamp/" class="game-card">
            <img src="images/animalstamptitlecard.png" alt="Animal Stamp game">
        </a>

        <!-- GAME CARD 26: minibeast whack -->
        <a href="minibeastwhack/" class="game-card">
            <img src="images/minibeasttitlecard.png" alt="Minibeast Whack Game">
        </a>

        
        <!-- GAME CARD 27: school bag -->
        <a href="school_bag/" class="game-card">
            <img src="images/school_bag.png" alt="School Bag Game">
        </a>
    </div>

    <footer>
        <p>© DoneNowPlay — Simple, calm symbol games for visual learners.</p>
    </footer>

</body>
</html>
