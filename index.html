    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214; /* Calming, low-distraction dark background */
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px 20px;
            background-color: #1a1a1e;
            border-bottom: 4px solid #4ade80; /* Friendly green accent anchor */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LOGO STYLING */
        .site-logo {
            max-width: 380px; /* Limits size on desktop */
            width: 100%;       /* Allows logo to shrink nicely on mobile */
            height: auto;
            margin-bottom: 10px;
            display: block;
        }

        header p {
            margin: 4px 0 0;
            color: #a1a1aa;
            font-size: 1.3rem;
            font-weight: 500;
        }

        /* Fixed 4-column Grid Layout */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Responsive tweak for smaller screens (tablets/phones) */
        @media (max-width: 768px) {
            .arcade-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .site-logo {
                max-width: 280px; /* Compact logo size for mobile screens */
            }
        }

        .game-card {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            border: 5px solid #27272a;
            transition: transform 0.15s ease-in-out, border-color 0.15s ease-in-out;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover, .game-card:focus {
            transform: scale(1.05);
            border-color: #4ade80;
            outline: none;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 15px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        footer {
            padding: 40px 20px;
            color: #71717a;
            font-size: 0.95rem;
        }
    </style>
</head>
