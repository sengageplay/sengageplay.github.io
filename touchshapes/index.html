<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cause & Effect: Tunnel Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Gentle "Touch" Prompt Overlay */
        #touch-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Allows clicks to pass right through to canvas */
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        #touch-prompt.hidden {
            opacity: 0;
        }

        /* Pulsing PECS Prompt Icon */
        .pecs-prompt-icon {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- Reusable Touch Prompt using your PECS symbol -->
<div id="touch-prompt">
    <img src="touch.png" alt="Touch PECS Prompt" class="pecs-prompt-icon">
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const promptElem = document.getElementById('touch-prompt');

    let audioCtx = null;
    let idleTimer = null;
    let activeTunnels = [];

    // Softer, sensory-friendly palette
    const PALETTE = [
        '#77DDFF', // Soft Sky Blue
        '#FF99C8', // Gentle Rose
        '#FCF6BD', // Pastel Yellow
        '#B9FBC0', // Mint Green
        '#E0C3FC', // Soft Lavender
        '#FFD6A5'  // Warm Peach
    ];

    const SHAPES = ['circle', 'hexagon', 'triangle', 'star', 'square'];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    /* --- AUDIO SYNTHESIS (Softer, slower, chime-like tones) --- */
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSoftChime() {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        // Gentle pentatonic chime frequencies
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C4 to C5
        const startFreq = notes[Math.floor(Math.random() * notes.length)];

        osc.type = 'sine'; // Softest waveform
        osc.frequency.setValueAtTime(startFreq, now);
        // Slow gentle sweep upward
        osc.frequency.exponentialRampToValueAtTime(startFreq * 1.5, now + 0.9);

        // Soft fade in and slow fade out (0.9s duration)
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        osc.start(now);
        osc.stop(now + 0.9);
    }

    /* --- SHAPE DRAWING HELPERS --- */
    function drawShape(type, x, y, r, color, lineWidth) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = 'round';

        if (type === 'circle') {
            ctx.arc(x, y, r, 0, Math.PI * 2);
        } else if (type === 'square') {
            ctx.rect(x - r, y - r, r * 2, r * 2);
        } else if (type === 'triangle') {
            for (let i = 0; i < 3; i++) {
                const angle = (Math.PI * 2 / 3) * i - Math.PI / 2;
                const px = x + Math.cos(angle) * r * 1.2;
                const py = y + Math.sin(angle) * r * 1.2;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        } else if (type === 'hexagon') {
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i;
                const px = x + Math.cos(angle) * r;
                const py = y + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        } else if (type === 'star') {
            const points = 5;
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? r * 1.1 : r * 0.55;
                const angle = (Math.PI / points) * i - Math.PI / 2;
                const px = x + Math.cos(angle) * radius;
                const py = y + Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }

        ctx.stroke();
    }

    /* --- TUNNEL CREATION --- */
    function createTunnel(x, y) {
        initAudio();
        playSoftChime();

        // Reset and hide prompt
        promptElem.classList.add('hidden');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            promptElem.classList.remove('hidden');
        }, 5000); // Reappear after 5 seconds of no touches

        const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const baseColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];

        // Create 6 concentric rings for the tunnel
        activeTunnels.push({
            x: x,
            y: y,
            shape: randomShape,
            color: baseColor,
            rings: [
                { r: 10, speed: 2.2 },
                { r: 35, speed: 2.2 },
                { r: 60, speed: 2.2 },
                { r: 85, speed: 2.2 },
                { r: 110, speed: 2.2 },
                { r: 135, speed: 2.2 }
            ],
            life: 1.0
        });
    }

    /* --- MAIN ANIMATION LOOP --- */
    function animate() {
        // Pure black background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Render tunnels
        for (let t = activeTunnels.length - 1; t >= 0; t--) {
            const tunnel = activeTunnels[t];
            tunnel.life -= 0.008; // Slower fade duration

            tunnel.rings.forEach(ring => {
                ring.r += ring.speed; // Slower expansion speed
                
                // Ring thickness scales down gracefully as it expands (capped size)
                const thickness = Math.max(2, 10 - (ring.r * 0.03));
                
                ctx.globalAlpha = Math.max(0, tunnel.life);
                drawShape(tunnel.shape, tunnel.x, tunnel.y, ring.r, tunnel.color, thickness);
            });

            ctx.globalAlpha = 1.0;

            // Remove tunnel when invisible or grown too large
            if (tunnel.life <= 0 || tunnel.rings[0].r > 320) {
                activeTunnels.splice(t, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    /* --- INPUT LISTENERS (Touch & Click) --- */
    canvas.addEventListener('pointerdown', (e) => {
        createTunnel(e.clientX, e.clientY);
    });

    // Spacebar / Enter support for switch users
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            createTunnel(canvas.width / 2, canvas.height / 2);
        }
    });

    animate();
</script>

</body>
</html>
