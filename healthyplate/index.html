<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill the Healthy Plate! (Mega Selection Edition)</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0fdf4; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Bar for Reset & Score */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 10px;
        }

        #score-board {
            background-color: #22c55e;
            color: white;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 3px 0 #166534;
        }

        #top-reset-btn {
            background-color: #6b7280;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 3px 0 #4b5563;
            transition: all 0.1s;
        }

        #top-reset-btn:hover {
            background-color: #4b5563;
        }

        #top-reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4b5563;
        }

        h1 {
            color: #166534;
            text-shadow: 2px 2px #bbf7d0;
            margin-bottom: 5px;
            text-align: center;
        }

        p {
            font-size: 1.2rem;
            color: #374151;
            margin-bottom: 20px;
            text-align: center;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 700px;
        }

        /* Responsive Food Grid */
        #food-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 500px) {
            #food-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            #top-bar {
                flex-direction: column;
                gap: 10px;
            }
        }

        .food-card {
            background-color: white;
            border: 4px solid #bbf7d0;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            user-select: none;
        }

        .food-card:hover {
            transform: scale(1.05);
            background-color: #f0fdf4;
        }

        .food-card.selected {
            border-color: #22c55e;
            background-color: #dcfce7;
            transform: scale(0.95);
        }

        .food-emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 5px;
        }

        .food-name {
            font-weight: bold;
            color: #1f2937;
        }

        /* The Plate Container */
        #plate-wrapper {
            position: relative;
        }

        #plate-area {
            position: relative;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ffffff 60%, #f3f4f6 100%);
            border: 15px solid #22c55e;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2;
        }

        #plate-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        #plate-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #22c55e;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            white-space: nowrap;
            z-index: 3;
        }

        .plate-item {
            font-size: 3.5rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Confetti Styles */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            animation: explode var(--duration) ease-out var(--delay) forwards;
        }

        @keyframes explode {
            0% {
                top: 50%;
                left: 50%;
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            80% {
                opacity: 1;
            }
            100% {
                top: var(--y);
                left: var(--x);
                opacity: 0;
                transform: scale(var(--scale)) rotate(var(--rotation));
            }
        }

        /* Buttons & Message */
        #controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background-color: #ea580c;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #c2410c;
            transition: all 0.1s;
        }

        .btn:hover {
            background-color: #f97316;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #c2410c;
        }

        #message {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 2.5rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        .success { color: #166534; }
        .error { color: #991b1b; }
    </style>
</head>
<body>

    <!-- Top Bar with Score & Reset -->
    <div id="top-bar">
        <div id="score-board">⭐ Correct Plates: <span id="score-val">0</span></div>
        <button id="top-reset-btn" onclick="resetGameTotal()">🔄 Reset Whole Game</button>
    </div>

    <h1>Fill the Healthy Plate! 🍽️</h1>
    <p>Every round is completely different! Can you find the <strong>3 healthy options</strong> hidden below?</p>

    <div id="game-container">
        <!-- Food Options Grid -->
        <div id="food-grid"></div>

        <!-- The Plate Area -->
        <div id="plate-wrapper">
            <div id="plate-area">
                <div id="plate-content"></div>
            </div>
            <div id="plate-label">YOUR PLATE</div>
        </div>

        <!-- Control Area -->
        <div id="controls">
            <div id="message"></div>
            <button class="btn" id="check-btn" onclick="checkAnswers()">Check Plate!</button>
        </div>
    </div>

    <script>
        // MASSIVE SELECTION POOL - 64 Unique Items (32 Healthy / 32 Treat Foods)
        const healthyPool = [
            { id: 1, name: 'Broccoli', emoji: '🥦' },
            { id: 2, name: 'Apple', emoji: '🍎' },
            { id: 3, name: 'Carrot', emoji: '🥕' },
            { id: 4, name: 'Banana', emoji: '🍌' },
            { id: 5, name: 'Strawberry', emoji: '🍓' },
            { id: 6, name: 'Grapes', emoji: '🍇' },
            { id: 7, name: 'Watermelon', emoji: '🍉' },
            { id: 8, name: 'Orange', emoji: '🍊' },
            { id: 17, name: 'Egg', emoji: '🥚' },
            { id: 18, name: 'Fish', emoji: '🐟' },
            { id: 19, name: 'Avocado', emoji: '🥑' },
            { id: 20, name: 'Blueberries', emoji: '🫐' },
            { id: 21, name: 'Corn', emoji: '🌽' },
            { id: 22, name: 'Tomato', emoji: '🍅' },
            { id: 23, name: 'Cherries', emoji: '🍒' },
            { id: 24, name: 'Pineapple', emoji: '🍍' },
            { id: 33, name: 'Kiwi', emoji: '🥝' },
            { id: 34, name: 'Pear', emoji: '🍐' },
            { id: 35, name: 'Mango', emoji: '🥭' },
            { id: 36, name: 'Cucumber', emoji: '🥒' },
            { id: 41, name: 'Chicken Breast', emoji: '🍗' },
            { id: 42, name: 'Cheese', emoji: '🧀' },
            { id: 43, name: 'Steak', emoji: '🥩' },
            { id: 44, name: 'Beans', emoji: '🫘' },
            { id: 49, name: 'Brown Rice', emoji: '🍚' },
            { id: 50, name: 'Oatmeal', emoji: '🥣' },
            { id: 51, name: 'Sweet Potato', emoji: '🍠' },
            { id: 52, name: 'Salad', emoji: '🥗' },
            { id: 53, name: 'Milk', emoji: '🥛' },
            { id: 54, name: 'Garlic', emoji: '🧄' },
            { id: 55, name: 'Onion', emoji: '🧅' },
            { id: 56, name: 'Melon', emoji: '🍈' }
        ];

        const junkPool = [
            { id: 9, name: 'Chocolate', emoji: '🍫' },
            { id: 10, name: 'Donut', emoji: '🍩' },
            { id: 11, name: 'Chips', emoji: '🍟' },
            { id: 12, name: 'Cupcake', emoji: '🧁' },
            { id: 13, name: 'Candy', emoji: '🍬' },
            { id: 14, name: 'Pizza', emoji: '🍕' },
            { id: 15, name: 'Burger', emoji: '🍔' },
            { id: 16, name: 'Ice Cream', emoji: '🍦' },
            { id: 25, name: 'Crisps', emoji: '🥔' },
            { id: 26, name: 'Fizzy Drink', emoji: '🥤' },
            { id: 27, name: 'Hot Dog', emoji: '🌭' },
            { id: 28, name: 'Cookies', emoji: '🍪' },
            { id: 29, name: 'Fried Chicken', emoji: '🍗' },
            { id: 30, name: 'Popcorn', emoji: '🍿' },
            { id: 31, name: 'Pancakes', emoji: '🥞' },
            { id: 32, name: 'Lollipop', emoji: '🍭' },
            { id: 37, name: 'Waffle', emoji: '🧇' },
            { id: 38, name: 'Taco', emoji: '🌮' },
            { id: 39, name: 'Burrito', emoji: '🌯' },
            { id: 40, name: 'Pretzel', emoji: '🥨' },
            { id: 45, name: 'Onion Rings', emoji: '🧅' },
            { id: 46, name: 'Milkshake', emoji: '🥛' },
            { id: 47, name: 'Bacon', emoji: '🥓' },
            { id: 48, name: 'Marshmallow', emoji: '🍡' },
            { id: 57, name: 'Cake Slice', emoji: '🍰' },
            { id: 58, name: 'Pie', emoji: '🥧' },
            { id: 59, name: 'Croissant', emoji: '🥐' },
            { id: 60, name: 'Donut Holes', emoji: '🍩' },
            { id: 61, name: 'Cotton Candy', emoji: '🍭' },
            { id: 62, name: 'Cheese Puffs', emoji: '🧀' },
            { id: 63, name: 'Pudding', emoji: '🍮' },       
            { id: 64, name: 'Chocolate Bar', emoji: '🍫' }
        ];

        let currentRoundItems = [];
        let selectedItems = [];
        let score = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function generateRoundData() {
            const shuffledHealthy = shuffle([...healthyPool]);
            const selectedHealthy = shuffledHealthy.slice(0, 3).map(item => ({ ...item, isHealthy: true }));

            const shuffledJunk = shuffle([...junkPool]);
            const selectedJunk = shuffledJunk.slice(0, 5).map(item => ({ ...item, isHealthy: false }));

            currentRoundItems = shuffle([...selectedHealthy, ...selectedJunk]);
        }

        function initGame() {
            const grid = document.getElementById('food-grid');
            const plateContent = document.getElementById('plate-content');
            const message = document.getElementById('message');
            
            grid.innerHTML = '';
            plateContent.innerHTML = '';
            message.innerHTML = '';
            selectedItems = [];
            
            document.getElementById('check-btn').style.display = "block";
            document.getElementById('check-btn').innerText = "Check Plate!";
            document.getElementById('check-btn').setAttribute('onclick', 'checkAnswers()');

            generateRoundData();

            currentRoundItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.setAttribute('data-id', item.id);
                card.innerHTML = `
                    <span class="food-emoji">${item.emoji}</span>
                    <span class="food-name">${item.name}</span>
                `;
                card.addEventListener('click', () => toggleFood(item, card));
                grid.appendChild(card);
            });
        }

        function resetGameTotal() {
            score = 0;
            document.getElementById('score-val').innerText = score;
            initGame();
        }

        function toggleFood(item, cardElement) {
            const message = document.getElementById('message');
            
            if (!item.isHealthy) {
                message.className = 'error';
                message.innerText = `Oops! ${item.emoji} ${item.name} is a treat food. Try looking for a healthier choice!`;
                return; 
            }

            const index = selectedItems.findIndex(i => i.id === item.id);

            if (index > -1) {
                selectedItems.splice(index, 1);
                cardElement.classList.remove('selected');
                message.innerText = ""; 
            } else {
                if (selectedItems.length >= 3) {
                    message.className = 'error';
                    message.innerText = "Your plate is full! Click a selected food to remove it first.";
                    return;
                }
                selectedItems.push(item);
                cardElement.classList.add('selected');
                message.innerText = ""; 
            }

            updatePlateVisuals();
        }

        function updatePlateVisuals() {
            const plateContent = document.getElementById('plate-content');
            plateContent.innerHTML = selectedItems.map(item => `
                <span class="plate-item" title="${item.name}">${item.emoji}</span>
            `).join('');
        }

        function triggerConfetti() {
            const wrapper = document.getElementById('plate-wrapper');
            const colors = ['#22c55e', '#ef4444', '#3b82f6', '#eab308', '#a855f7', '#ff7849', '#06b6d4', '#ec4899'];
            
            // MEGA BLAST: Increased to 160 elements
            const particleCount = 160; 
            
            for (let i = 0; i < particleCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // Trajectory math (pushes particles out wide across 360 degrees)
                const angle = Math.random() * Math.PI * 2;
                const distance = 120 + Math.random() * 280; // Sweeps out much further
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                // Setup custom physics property modifiers for CSS
                confetti.style.setProperty('--x', `calc(50% + ${x}px)`);
                confetti.style.setProperty('--y', `calc(50% + ${y}px)`);
                confetti.style.setProperty('--duration', `${1.2 + Math.random() * 0.8}s`);
                confetti.style.setProperty('--delay', `${Math.random() * 0.25}s`); // Slight staggered delay for wave effect
                confetti.style.setProperty('--rotation', `${180 + Math.random() * 540}deg`);
                confetti.style.setProperty('--scale', `${0.3 + Math.random() * 0.7}`);
                
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Mix shape styling (some circles, some rectangles)
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '0%'; // Square/Rectangular strip
                } else {
                    confetti.style.borderRadius = '50%'; // Circle dot
                }

                // Random dimensions for visual texture
                const w = 7 + Math.random() * 10;
                const h = 7 + Math.random() * 12;
                confetti.style.width = `${w}px`;
                confetti.style.height = `${h}px`;

                wrapper.appendChild(confetti);

                // Housekeeping: drop elements once finished
                setTimeout(() => confetti.remove(), 2500);
            }
        }

        function checkAnswers() {
            const message = document.getElementById('message');

            if (selectedItems.length < 3) {
                message.className = 'error';
                message.innerText = `You only have ${selectedItems.length} item(s) on your plate. Pick exactly 3!`;
                return;
            }

            const allHealthy = selectedItems.every(item => item.isHealthy);

            if (allHealthy) {
                score++;
                document.getElementById('score-val').innerText = score;
                triggerConfetti();

                message.className = 'success';
                message.innerHTML = "🎉 <strong>Amazing job!</strong> You found all 3 healthy options for this round!<br><span style='font-size: 1.1rem; font-weight: normal; color: #4b5563;'>Remember, junk foods and treats are perfectly good to eat as well—as long as we enjoy them in moderation! 😋</span>";
                
                const btn = document.getElementById('check-btn');
                btn.innerText = "Play Another Round!";
                btn.setAttribute('onclick', 'initGame()');
            }
        }

        initGame();
    </script>
</body>
</html>
